            document.body.style.backgroundColor = 'pink'
            document.body.style.color = 'blue'

        }
    </script>

    <script>
        function voltar(){
            document.body.style.backgroundColor = 'white'
            document.body.style.color = 'blue'
            document.body.style.fontSize = '25px'
            
            
        }
    </script>

    
</body>
